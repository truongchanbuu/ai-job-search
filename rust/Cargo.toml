[workspace]
resolver = "2"
members = ["crates/radar-domain", "crates/radar-application", "crates/radar-adapters", "apps/radar-server", "apps/radar-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
url = "2"
anyhow = "1"
radar-domain = { path = "crates/radar-domain" }
radar-application = { path = "crates/radar-application" }
radar-adapters = { path = "crates/radar-adapters" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "process"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
